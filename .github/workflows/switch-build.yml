name: Build VCSNative (Nintendo Switch)

# Unverified: written against the documented devkitpro/devkita64 Docker
# image and its dkp-pacman package names, not run here. Expect to fix
# package names or CMake flags on the first real run in Actions.

on:
  pull_request:
    branches: [switch-port]
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    # Official devkitPro image: has devkitA64 + libnx preinstalled under
    # /opt/devkitpro. See https://hub.docker.com/r/devkitpro/devkita64
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # switch-ffmpeg isn't in the base image; the profile's CMakeLists.txt
      # (NINTENDO_SWITCH branch) find_library()s avcodec/avformat/avutil/
      # swresample/swscale, plus zlib/bzip2/dav1d, and needs those installed
      # first. switch-tools provides nacptool/elf2nro for the .nro packaging
      # step at the bottom of the same CMakeLists.txt.
      - name: Install extra devkitPro packages
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export PATH="${DEVKITPRO}/tools/bin:${PATH}"
          dkp-pacman -Sy --noconfirm --needed switch-ffmpeg switch-tools

      - name: Configure
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          cmake -B build-switch \
            -DCMAKE_TOOLCHAIN_FILE="${DEVKITPRO}/cmake/Switch.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPSPRECOMP_PROFILE=vcs \
            -DPSPRECOMP_BUILD_TESTS=OFF \
            -DPSPRECOMP_BUILD_PROFILE_TESTS=OFF

      - name: Build
        shell: bash
        # Build the packaging target, not just the raw executable: VCSNative_nro
        # depends on VCSNative (defined in CMakeLists.txt's NINTENDO_SWITCH
        # block), so this still builds the .elf first, then runs
        # nacptool/elf2nro to produce the .nacp/.nro. Building only
        # `--target VCSNative` (as before) skips that packaging step
        # entirely, since nothing else in the "all" target set depends on it
        # the way this invocation is scoped.
        run: cmake --build build-switch --target VCSNative_nro -- -j"$(nproc)"

      - name: Locate build output
        shell: bash
        run: |
          echo "Contents of build-switch/bin:"
          find build-switch/bin -maxdepth 3 -type f -print

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: VCSNative-switch
          # .nacp/.nro now land in the same $<TARGET_FILE_DIR:VCSNative>
          # directory as the .elf and the .ini/.bin/.md/.txt files the
          # CMakeLists.txt copies alongside it (see its bottom
          # add_custom_command), so grabbing the whole bin/ tree gets
          # everything needed to actually run this in one place.
          path: build-switch/bin/**
          if-no-files-found: warn
          retention-days: 14
